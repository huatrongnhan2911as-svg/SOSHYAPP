name: soshy_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Thêm thư viện này để kết nối với file PHP (API)
  http: ^1.1.0 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Đây là chỗ quan trọng nhất để sửa lỗi "Unable to load asset"
  assets:
    - lib/images/
